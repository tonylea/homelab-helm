suite: 1Password ClusterSecretStore
templates:
  - templates/clustersecretstore.yaml
set:
  vault: test-vault
tests:
  - it: is a ClusterSecretStore named onepassword
    asserts:
      - isKind:
          of: ClusterSecretStore
      - isAPIVersion:
          of: external-secrets.io/v1
      - equal:
          path: metadata.name
          value: onepassword

  - it: reads the configured vault
    asserts:
      - equal:
          path: spec.provider.onepasswordSDK.vault
          value: test-vault

  - it: fails without a vault
    set:
      vault: ""
    asserts:
      - failedTemplate:
          errorPattern: vault is required

  - it: authenticates with the service account token Secret
    asserts:
      - equal:
          path: spec.provider.onepasswordSDK.auth.serviceAccountSecretRef
          value:
            name: onepassword-service-account
            key: token
            namespace: external-secrets

  - it: follows an overridden token Secret
    set:
      serviceAccountToken:
        secretName: other-token
        key: credential
        namespace: secrets
    asserts:
      - equal:
          path: spec.provider.onepasswordSDK.auth.serviceAccountSecretRef
          value:
            name: other-token
            key: credential
            namespace: secrets
