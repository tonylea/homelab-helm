apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.storeName }}
  labels:
    {{- include "store.labels" . | nindent 4 }}
spec:
  provider:
    onepasswordSDK:
      vault: {{ required "vault is required" .Values.vault | quote }}
      auth:
        serviceAccountSecretRef:
          name: {{ .Values.serviceAccountToken.secretName }}
          key: {{ .Values.serviceAccountToken.key }}
          namespace: {{ .Values.serviceAccountToken.namespace }}
