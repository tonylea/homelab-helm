{{- range $name, $cluster := .Values.clusters }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cluster-{{ $name }}
  labels:
    {{- include "argocd-clusters.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $.Values.refreshInterval }}
  secretStoreRef:
    kind: {{ $.Values.secretStoreRef.kind }}
    name: {{ $.Values.secretStoreRef.name }}
  target:
    name: cluster-{{ $name }}
    template:
      engineVersion: v2
      metadata:
        labels:
          {{- with $cluster.labels }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          argocd.argoproj.io/secret-type: cluster
      data:
        name: {{ $name | quote }}
        server: {{ required (printf "clusters.%s.server is required" $name) $cluster.server | quote }}
        # Argo CD's cluster connection config. The braces below are filled in by
        # External Secrets Operator from 1Password, not by Helm.
        config: |
          {"bearerToken": "{{ "{{ .token }}" }}", "tlsClientConfig": {"caData": "{{ "{{ .ca }}" }}"}}
  data:
    {{- $item := required (printf "clusters.%s.onepasswordItem is required" $name) $cluster.onepasswordItem }}
    - secretKey: token
      remoteRef:
        key: {{ printf "%s/credential" $item }}
    - secretKey: ca
      remoteRef:
        key: {{ printf "%s/ca" $item }}
{{- end }}
