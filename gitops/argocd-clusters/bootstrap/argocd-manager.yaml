# Applied by hand, once, to each external cluster, before Argo CD can deploy there.
# Argo CD can't create these itself: it has no access to the cluster yet.
#
#   kubectl --context <cluster> apply -f gitops/argocd-clusters/bootstrap/argocd-manager.yaml
#
# Same ServiceAccount, namespace and cluster-wide admin rights as `argocd cluster add`
# creates. The Secret holds a long-lived token for it; delete the Secret to revoke it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-manager
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: argocd-manager
    namespace: kube-system
---
apiVersion: v1
kind: Secret
metadata:
  name: argocd-manager-token
  namespace: kube-system
  annotations:
    kubernetes.io/service-account.name: argocd-manager
type: kubernetes.io/service-account-token
