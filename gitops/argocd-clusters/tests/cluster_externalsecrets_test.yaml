suite: Argo CD cluster ExternalSecrets
templates:
  - templates/cluster-externalsecrets.yaml
set:
  clusters:
    k3s:
      server: https://k3s.example:6443
      onepasswordItem: argocd-cluster-k3s
tests:
  - it: creates one ExternalSecret per cluster
    set:
      clusters:
        k3s:
          server: https://k3s.example:6443
          onepasswordItem: argocd-cluster-k3s
        other:
          server: https://other.example:6443
          onepasswordItem: argocd-cluster-other
    asserts:
      - hasDocuments:
          count: 2

  - it: creates nothing without clusters
    set:
      clusters: null
    asserts:
      - hasDocuments:
          count: 0

  - it: builds a Secret Argo CD recognises as a cluster
    asserts:
      - isKind:
          of: ExternalSecret
      - equal:
          path: spec.target.name
          value: cluster-k3s
      - equal:
          path: spec.target.template.metadata.labels["argocd.argoproj.io/secret-type"]
          value: cluster
      - equal:
          path: spec.target.template.data.name
          value: k3s
      - equal:
          path: spec.target.template.data.server
          value: https://k3s.example:6443

  - it: adds the cluster's labels to the cluster Secret
    set:
      clusters:
        k3s:
          labels:
            observability-agent: "true"
    asserts:
      - equal:
          path: spec.target.template.metadata.labels
          value:
            observability-agent: "true"
            argocd.argoproj.io/secret-type: cluster

  - it: leaves the token and CA for External Secrets Operator to fill in
    asserts:
      - matchRegex:
          path: spec.target.template.data.config
          pattern: '"bearerToken": "\{\{ \.token \}\}"'
      - matchRegex:
          path: spec.target.template.data.config
          pattern: '"caData": "\{\{ \.ca \}\}"'

  - it: reads the token and CA from the cluster's 1Password item
    asserts:
      - equal:
          path: spec.data
          value:
            - secretKey: token
              remoteRef:
                key: argocd-cluster-k3s/credential
            - secretKey: ca
              remoteRef:
                key: argocd-cluster-k3s/ca

  - it: uses the onepassword ClusterSecretStore
    asserts:
      - equal:
          path: spec.secretStoreRef
          value:
            kind: ClusterSecretStore
            name: onepassword
