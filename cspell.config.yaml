# cspell config, used by the lint workflow and local runs.
version: "0.2"
# British and American spellings are both accepted.
language: en,en-GB
useGitignore: true
ignorePaths:
  - "**/charts/**"
  - "**/Chart.lock"
  - ".git/**"
words:
  - clustersecretstore
  - containeroo
  - datreeio
  - dorny
  - endgroup
  - eventhandler
  - externalsecret
  - homelab
  - kubeconform
  - logfmt
  - nindent
  - nullglob
  - onepassword
  - shopt
  - spanmetrics
  - statefulset
  - subchart
  - urlencode
