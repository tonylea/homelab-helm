# cspell config, used by the lint workflow and local runs.
version: "0.2"
# British and American spellings are both accepted.
language: en,en-GB
useGitignore: true
ignorePaths:
  - "**/charts/**"
  - "**/Chart.lock"
  - ".git/**"
words:
  - apiserver
  - argocd
  - argoproj
  - bsd
  - cadvisor
  - cef
  - clustersecretstore
  - containeroo
  - coredns
  - daemonset
  - datreeio
  - dockercontainers
  - dorny
  - endgroup
  - eventhandler
  - externalsecret
  - homeassistant
  - homelab
  - ietf
  - kubeconform
  - kubelet
  - logfmt
  - metallb
  - nindent
  - nullglob
  - onepassword
  - otelcol
  - otlphttp
  - podmonitors
  - rfc
  - servicemonitors
  - shopt
  - spanmetrics
  - statefulset
  - subchart
  - systemd
  - traefik
  - urlencode
  - varlog
