{{- with .Values.grafanaAdmin.externalSecret }}
{{- if .enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "stack.grafanaAdminSecret" $ }}
  labels:
    {{- include "stack.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ .refreshInterval }}
  secretStoreRef:
    {{- toYaml .secretStoreRef | nindent 4 }}
  target:
    name: {{ include "stack.grafanaAdminSecret" $ }}
    creationPolicy: Owner
  data:
    {{- $admin := index $.Values "kube-prometheus-stack" "grafana" "admin" }}
    {{- range $field, $secretKey := dict "user" $admin.userKey "password" $admin.passwordKey }}
    - secretKey: {{ $secretKey }}
      remoteRef:
        {{- toYaml (index $.Values.grafanaAdmin.externalSecret.remoteRefs $field | required (printf "grafanaAdmin.externalSecret.remoteRefs.%s is required" $field)) | nindent 8 }}
    {{- end }}
{{- end }}
{{- end }}
