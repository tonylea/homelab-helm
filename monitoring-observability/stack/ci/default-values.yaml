# Values for CI: ct lint and the end-to-end test on a throwaway kind cluster.
# No 1Password, no persistence, small footprint to fit a GitHub-hosted runner.

grafanaAdmin:
  externalSecret:
    enabled: false

kube-prometheus-stack:
  kubeEtcd:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeControllerManager:
    enabled: false
  kubeProxy:
    enabled: false
  alertmanager:
    enabled: false
  prometheus:
    prometheusSpec:
      retention: 1h
      retentionSize: ""
      storageSpec: {}
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
  grafana:
    admin:
      existingSecret: ""
    adminPassword: ci-only-password
    persistence:
      enabled: false

loki:
  singleBinary:
    persistence:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi

tempo:
  persistence:
    enabled: false
