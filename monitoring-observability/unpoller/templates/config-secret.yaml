{{- $existing := .Values.unpoller.upConfigExistingSecret }}
{{- with .Values.unifi }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $existing.name }}
  labels:
    {{- include "unpoller.wrapperLabels" $ | nindent 4 }}
stringData:
  {{ $existing.key }}: |
    [poller]
      debug = false
      quiet = false

    [prometheus]
      disable = false
      http_listen = "0.0.0.0:9130"
      report_errors = false

    [influxdb]
      disable = true

    [loki]
      disable = true

    [webserver]
      enable = false

    [unifi]
      dynamic = false

    # The polled controller. user and pass come from UP_UNIFI_DEFAULT_USER and
    # UP_UNIFI_DEFAULT_PASS.
    [unifi.defaults]
      url = {{ required "unifi.url is required" .url | quote }}
      sites = {{ .sites | toJson }}
      verify_ssl = {{ .verifySsl }}
      save_sites = {{ .saveSites }}
      save_dpi = {{ .saveDpi }}
      save_ids = {{ .saveIds }}
      save_events = false
      save_alarms = false
      save_anomalies = false
      hash_pii = false
{{- end }}
