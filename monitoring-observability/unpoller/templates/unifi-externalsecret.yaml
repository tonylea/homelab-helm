{{- with .Values.externalSecret }}
{{- if .enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unpoller-unifi
  labels:
    {{- include "unpoller.wrapperLabels" $ | nindent 4 }}
spec:
  refreshInterval: {{ .refreshInterval }}
  secretStoreRef:
    {{- toYaml .secretStoreRef | nindent 4 }}
  target:
    name: unpoller-unifi
    creationPolicy: Owner
  data:
    {{- range $field := list "username" "password" }}
    - secretKey: {{ $field }}
      remoteRef:
        {{- toYaml (index $.Values.externalSecret.remoteRefs $field) | nindent 8 }}
    {{- end }}
{{- end }}
{{- end }}
