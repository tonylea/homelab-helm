# minikube overrides. Argo Application:
#   valueFiles: [values.yaml, values-minikube.yaml]

grafanaAdmin:
  externalSecret:
    enabled: true

# Web UIs go through minikube's ingress-nginx addon on ports 80/443. Each host
# needs an /etc/hosts entry pointing at 127.0.0.1.
kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: observability-ssd
      # Label what this Prometheus scrapes itself (the core's own components) with
      # the cluster name, matching what observability-agent adds to its data.
      scrapeClasses:
        - name: cluster-label
          default: true
          relabelings:
            # action is the API server's default; set it so Argo's diff matches
            # what the cluster stores.
            - action: replace
              targetLabel: cluster
              replacement: minikube
    ingress:
      enabled: true
      ingressClassName: nginx
      hosts: [prometheus.local]
      paths: [/]
      pathType: Prefix
  alertmanager:
    ingress:
      enabled: true
      ingressClassName: nginx
      hosts: [alertmanager.local]
      paths: [/]
      pathType: Prefix
  grafana:
    persistence:
      storageClassName: observability-ssd
    # Grafana's own traces (HTTP requests, datasource queries), sent to
    # observability-agent's OTLP receiver like any other app on this cluster.
    grafana.ini:
      tracing.opentelemetry.otlp:
        address: alloy-receiver.observability.svc:4317
    ingress:
      enabled: true
      ingressClassName: nginx
      hosts: [grafana.local]
      path: /

loki:
  singleBinary:
    persistence:
      storageClass: observability-ssd

tempo:
  persistence:
    storageClassName: observability-ssd
