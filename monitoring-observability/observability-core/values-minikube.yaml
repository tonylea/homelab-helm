# minikube overrides. Argo Application:
#   valueFiles: [values.yaml, values-minikube.yaml]

grafanaAdmin:
  externalSecret:
    enabled: true

# Web UIs and the ingest endpoints for other clusters go through minikube's ingress-nginx
# addon on ports 80/443. Each host needs a DNS record pointing at the Mac running
# minikube. Ingest hosts keep ingress-nginx's 1m default request size: agents' log and
# metric batches fit; raise it only if measured batch sizes or 413 errors show a need.
tempoOtlpIngress:
  enabled: true
  host: tempo.internal.deadrobot.co.uk

kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: observability-ssd
      # Label what this Prometheus scrapes itself (the core's own components) with
      # the cluster name, matching what observability-agent adds to its data.
      scrapeClasses:
        - name: cluster-label
          default: true
          relabelings:
            # action is the API server's default; set it so Argo's diff matches
            # what the cluster stores.
            - action: replace
              targetLabel: cluster
              replacement: minikube
    # UI, and remote write (/api/v1/write) for other clusters' agents.
    ingress:
      enabled: true
      ingressClassName: nginx
      hosts: [prometheus.internal.deadrobot.co.uk]
      paths: [/]
      pathType: Prefix
  alertmanager:
    ingress:
      enabled: true
      ingressClassName: nginx
      hosts: [alertmanager.internal.deadrobot.co.uk]
      paths: [/]
      pathType: Prefix
  grafana:
    persistence:
      storageClassName: observability-ssd
    # Grafana's own traces (HTTP requests, datasource queries), sent to
    # observability-agent's OTLP receiver like any other app on this cluster.
    grafana.ini:
      tracing.opentelemetry.otlp:
        address: alloy-receiver.observability.svc:4317
    ingress:
      enabled: true
      ingressClassName: nginx
      hosts: [grafana.internal.deadrobot.co.uk]
      path: /

loki:
  singleBinary:
    persistence:
      storageClass: observability-ssd
  # Push endpoints only, for other clusters' agents. Querying stays inside the cluster,
  # through Grafana.
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts: [loki.internal.deadrobot.co.uk]
    paths:
      distributor:
        - /loki/api/v1/push
        - /otlp/v1/logs
      queryFrontend: []
      ruler: []
      compactor: []

tempo:
  persistence:
    storageClassName: observability-ssd
