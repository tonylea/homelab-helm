# minikube overrides. Argo Application:
#   valueFiles: [values.yaml, values-minikube.yaml]

grafanaAdmin:
  externalSecret:
    enabled: true

# Web UIs go through minikube's ingress-nginx addon on ports 80/443. Each host
# needs an /etc/hosts entry pointing at 127.0.0.1.
kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: observability-ssd
    ingress:
      enabled: true
      ingressClassName: nginx
      hosts: [prometheus.local]
      paths: [/]
      pathType: Prefix
  alertmanager:
    ingress:
      enabled: true
      ingressClassName: nginx
      hosts: [alertmanager.local]
      paths: [/]
      pathType: Prefix
  grafana:
    persistence:
      storageClassName: observability-ssd
    ingress:
      enabled: true
      ingressClassName: nginx
      hosts: [grafana.local]
      path: /
  # minikube binds these control-plane components to 127.0.0.1, so scraping them
  # only produces "target down" alerts.
  kubeEtcd:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeControllerManager:
    enabled: false
  kubeProxy:
    enabled: false

loki:
  singleBinary:
    persistence:
      storageClass: observability-ssd

tempo:
  persistence:
    storageClassName: observability-ssd
