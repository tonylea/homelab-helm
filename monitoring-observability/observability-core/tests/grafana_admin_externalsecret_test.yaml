suite: grafana admin ExternalSecret
templates:
  - templates/grafana-admin-externalsecret.yaml
tests:
  - it: is off by default
    asserts:
      - hasDocuments:
          count: 0

  - it: is on for minikube
    values:
      - ../values-minikube.yaml
    asserts:
      - isKind:
          of: ExternalSecret
      - isAPIVersion:
          of: external-secrets.io/v1

  - it: creates the Secret Grafana is configured to read
    set:
      grafanaAdmin.externalSecret.enabled: true
      kube-prometheus-stack.grafana.admin.existingSecret: my-grafana
    asserts:
      - equal:
          path: spec.target.name
          value: my-grafana

  - it: maps 1Password fields onto Grafana's configured Secret keys
    set:
      grafanaAdmin.externalSecret.enabled: true
      kube-prometheus-stack.grafana.admin.userKey: user
      kube-prometheus-stack.grafana.admin.passwordKey: pass
    asserts:
      - contains:
          path: spec.data
          content:
            secretKey: user
            remoteRef:
              key: grafana-admin/username
      - contains:
          path: spec.data
          content:
            secretKey: pass
            remoteRef:
              key: grafana-admin/password

  - it: uses the configured ClusterSecretStore
    set:
      grafanaAdmin.externalSecret.enabled: true
      grafanaAdmin.externalSecret.secretStoreRef.name: vault
    asserts:
      - equal:
          path: spec.secretStoreRef
          value:
            kind: ClusterSecretStore
            name: vault

  - it: fails without a Secret name for Grafana
    set:
      grafanaAdmin.externalSecret.enabled: true
      kube-prometheus-stack.grafana.admin.existingSecret: ""
    asserts:
      - failedTemplate:
          errorPattern: existingSecret is required
