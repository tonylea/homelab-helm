{{- $c := .Values.collect }}
{{- $cluster := required "cluster is required" .Values.cluster }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.alloy.alloy.configMap.name }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
data:
  {{ .Values.alloy.alloy.configMap.key }}: |
    logging {
      level  = "info"
      format = "logfmt"
    }
    {{- if or $c.podLogs $c.events }}

    loki.write "default" {
      endpoint {
        url = "{{ include "agent.endpoint" (dict "ctx" . "name" "loki") }}/loki/api/v1/push"
      }
      external_labels = {
        cluster = "{{ $cluster }}",
      }
    }
    {{- end }}
    {{- if $c.podLogs }}

    // Pod logs, tailed through the Kubernetes API and shared across Alloy replicas.
    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.relabel "pod_logs" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        target_label  = "app"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
        separator     = "/"
        target_label  = "job"
      }
    }

    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pod_logs.output
      forward_to = [loki.write.default.receiver]

      clustering {
        enabled = true
      }
    }
    {{- end }}
    {{- if $c.events }}

    loki.source.kubernetes_events "events" {
      job_name   = "integrations/kubernetes/eventhandler"
      log_format = "logfmt"
      forward_to = [loki.write.default.receiver]
    }
    {{- end }}
    {{- if $c.otlp }}

    // OTLP from applications: traces to Tempo, metrics to Prometheus, logs to Loki.
    otelcol.receiver.otlp "default" {
      grpc {
        endpoint = "0.0.0.0:4317"
      }
      http {
        endpoint = "0.0.0.0:4318"
      }
      output {
        traces  = [otelcol.processor.transform.cluster.input]
        metrics = [otelcol.processor.transform.cluster.input]
        logs    = [otelcol.processor.transform.cluster.input]
      }
    }

    otelcol.processor.transform "cluster" {
      error_mode = "ignore"

      trace_statements {
        context    = "resource"
        statements = [`set(attributes["k8s.cluster.name"], "{{ $cluster }}")`]
      }
      metric_statements {
        context    = "resource"
        statements = [`set(attributes["k8s.cluster.name"], "{{ $cluster }}")`]
      }
      log_statements {
        context    = "resource"
        statements = [`set(attributes["k8s.cluster.name"], "{{ $cluster }}")`]
      }

      output {
        traces  = [otelcol.processor.batch.default.input]
        metrics = [otelcol.processor.batch.default.input]
        logs    = [otelcol.processor.batch.default.input]
      }
    }

    otelcol.processor.batch "default" {
      output {
        traces  = [otelcol.exporter.otlp.tempo.input]
        metrics = [otelcol.exporter.prometheus.default.input]
        logs    = [otelcol.exporter.otlphttp.loki.input]
      }
    }

    otelcol.exporter.otlp "tempo" {
      client {
        endpoint = "{{ include "agent.endpoint" (dict "ctx" . "name" "tempoOtlpGrpc") }}"
        tls {
          insecure = true
        }
      }
    }

    otelcol.exporter.prometheus "default" {
      forward_to = [prometheus.remote_write.default.receiver]
    }

    prometheus.remote_write "default" {
      endpoint {
        url = "{{ include "agent.endpoint" (dict "ctx" . "name" "prometheus") }}/api/v1/write"
      }
      external_labels = {
        cluster = "{{ $cluster }}",
      }
    }

    otelcol.exporter.otlphttp "loki" {
      client {
        endpoint = "{{ include "agent.endpoint" (dict "ctx" . "name" "loki") }}/otlp"
      }
    }
    {{- end }}
