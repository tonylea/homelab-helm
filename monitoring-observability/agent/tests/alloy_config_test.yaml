suite: alloy config
templates:
  - templates/alloy-config.yaml
values:
  - ../values-minikube.yaml
tests:
  - it: uses the ConfigMap name and key the Alloy subchart mounts
    set:
      alloy.alloy.configMap.name: custom-name
      alloy.alloy.configMap.key: custom.alloy
    asserts:
      - equal:
          path: metadata.name
          value: custom-name
      - exists:
          path: data["custom.alloy"]

  - it: labels everything with the cluster name
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'loki.write "default"[\s\S]*cluster = "minikube"'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'prometheus.remote_write "default"[\s\S]*cluster = "minikube"'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'set\(attributes\["k8s.cluster.name"\], "minikube"\)'

  - it: appends API paths to the endpoint base URLs
    set:
      endpoints.loki: http://loki:3100/
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'url = "http://loki:3100/loki/api/v1/push"'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'endpoint = "http://loki:3100/otlp"'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'url = "http://prometheus-stack-prometheus.monitoring.svc:9090/api/v1/write"'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'endpoint = "tempo.monitoring.svc:4317"'

  - it: leaves out OTLP when disabled
    set:
      collect.otlp: false
    asserts:
      - notMatchRegex:
          path: data["config.alloy"]
          pattern: otelcol
      - notMatchRegex:
          path: data["config.alloy"]
          pattern: prometheus.remote_write

  - it: leaves out Loki push when pod logs and events are disabled
    set:
      collect.podLogs: false
      collect.events: false
    asserts:
      - notMatchRegex:
          path: data["config.alloy"]
          pattern: loki.write
      - notMatchRegex:
          path: data["config.alloy"]
          pattern: loki.source

  - it: does not need endpoints for disabled pipelines
    set:
      collect.otlp: false
      endpoints.prometheus: ""
      endpoints.tempoOtlpGrpc: ""
    asserts:
      - isKind:
          of: ConfigMap

  - it: fails without a cluster name
    set:
      cluster: ""
    asserts:
      - failedTemplate:
          errorPattern: cluster is required

  - it: fails when an enabled pipeline has no endpoint
    set:
      endpoints.tempoOtlpGrpc: ""
    asserts:
      - failedTemplate:
          errorPattern: endpoints.tempoOtlpGrpc is required
