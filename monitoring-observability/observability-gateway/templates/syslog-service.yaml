{{- with .Values.syslog.listeners }}
apiVersion: v1
kind: Service
metadata:
  name: alloy-gateway-syslog
  labels:
    {{- include "observability-gateway.labels" $ | nindent 4 }}
  {{- $annotations := $.Values.syslog.service.annotations | default dict }}
  {{- with $.Values.syslog.service.loadBalancerIP }}
  {{- $annotations = merge (dict "metallb.io/loadBalancerIPs" .) $annotations }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: LoadBalancer
  # Keeps senders' source IPs.
  externalTrafficPolicy: Local
  selector:
    {{- include "observability-gateway.alloySelector" $ | nindent 4 }}
  ports:
    {{- range . }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ include "observability-gateway.syslogContainerPort" . }}
      protocol: {{ upper .protocol }}
    {{- end }}
{{- end }}
