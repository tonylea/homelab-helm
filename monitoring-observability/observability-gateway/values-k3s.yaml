# k3s overrides. Argo Application (destination: the k3s cluster, namespace observability):
#   valueFiles: [values.yaml, values-k3s.yaml]
# Sends to observability-core on minikube through its ingress. Plain HTTP until TLS is
# set up.

endpoints:
  loki: http://loki.internal.deadrobot.co.uk
  prometheus: http://prometheus.internal.deadrobot.co.uk
  tempoOtlpHttp: http://tempo.internal.deadrobot.co.uk

# DNS: gateway.internal.deadrobot.co.uk. The IP must be in the MetalLB pool.
service:
  loadBalancerIP: 192.168.30.51

alloy-gateway:
  # Scraped by the k3s agent's alloy-metrics.
  serviceMonitor:
    enabled: true
