# Grafana Alloy collector, one install per cluster. The Alloy config is generated by
# this chart's templates/alloy-config.yaml from the values below.

# Added as the `cluster` label on everything this agent sends. Required.
cluster: ""

# Where observability-core receives data. Base URLs; the chart appends the API paths.
endpoints:
  # Loki base URL, e.g. http://loki.observability.svc:3100
  loki: ""
  # Prometheus base URL, e.g. http://prometheus-stack-prometheus.observability.svc:9090
  prometheus: ""
  # Tempo OTLP gRPC host:port, e.g. tempo.observability.svc:4317
  tempoOtlpGrpc: ""

collect:
  # Container logs from every pod, read through the Kubernetes API.
  podLogs: true
  # Kubernetes events as log lines. Keep alloy.controller.replicas at 1 or events
  # are shipped once per replica.
  events: true
  # Accept OTLP (traces, metrics, logs) from applications on 4317/4318 and forward
  # traces to Tempo, metrics to Prometheus and logs to Loki.
  otlp: true

alloy:
  fullnameOverride: alloy-agent
  controller:
    type: deployment
    replicas: 1
  alloy:
    configMap:
      create: false
      # Must match the ConfigMap name in templates/alloy-config.yaml.
      name: alloy-agent-config
      key: config.alloy
    clustering:
      enabled: true
    extraPorts:
      - name: otlp-grpc
        port: 4317
        targetPort: 4317
        protocol: TCP
      - name: otlp-http
        port: 4318
        targetPort: 4318
        protocol: TCP
  serviceMonitor:
    enabled: true
