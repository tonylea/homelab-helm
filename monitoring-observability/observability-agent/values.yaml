# Per-cluster collectors, one install per cluster. Follows the collector layout from
# Grafana's k8s-monitoring chart: one Alloy instance per job, each with its own
# config generated by this chart's templates/alloy-*-config.yaml:
#   alloy-logs      DaemonSet    pod logs and node (journal) logs from each node's files
#   alloy-receiver  1 replica    OTLP from applications
#   alloy-events    1 replica    Kubernetes events
#   alloy-metrics   StatefulSet  kubelet, cAdvisor, API server, CoreDNS, node-exporter,
#                                kube-state-metrics, ServiceMonitors and PodMonitors
# Metrics keep the job labels kube-prometheus-stack's dashboards and alerts expect
# (kubelet, apiserver, coredns, node-exporter, kube-state-metrics).

# Added as the `cluster` label on everything this agent sends. Required.
cluster: ""

# Where observability-core receives data. Base URLs; the chart appends the API paths.
endpoints:
  # Loki base URL, e.g. http://loki.observability.svc:3100
  loki: ""
  # Prometheus base URL, e.g. http://prometheus-stack-prometheus.observability.svc:9090
  prometheus: ""
  # Tempo OTLP: set one. gRPC host:port, e.g. tempo.observability.svc:4317, for the same
  # cluster; or an HTTP base URL, e.g. http://tempo.internal.deadrobot.co.uk, through an
  # ingress (the chart appends /v1/traces). HTTP wins if both are set.
  tempoOtlpGrpc: ""
  tempoOtlpHttp: ""

collect:
  # Container logs from every pod, read from /var/log/pods on each node.
  podLogs: true
  # Node logs (kubelet, container runtime, k3s, ...) from the systemd journal.
  nodeLogs: true
  # Kubernetes events as log lines.
  events: true
  # Accept OTLP (traces, metrics, logs) from applications on 4317/4318 and forward
  # traces to Tempo, metrics to Prometheus and logs to Loki.
  otlp: true
  # kubelet, cAdvisor, API server and CoreDNS metrics, plus node-exporter and
  # kube-state-metrics (deployed by this chart when on).
  clusterMetrics: true
  # Scrape targets defined by ServiceMonitors and PodMonitors. Needs the Prometheus
  # Operator CRDs in the cluster.
  serviceMonitors: true

nodeLogs:
  # Journal directory to read. Empty reads both places journald writes:
  # /var/log/journal (kept on disk) and /run/log/journal (kept in memory, e.g. the
  # Raspberry Pi OS default). Both are mounted into alloy-logs below.
  journalPath: ""

# How often the metrics collector scrapes. Matches kube-prometheus-stack's default.
scrapeInterval: 30s

# Requests and limits for every Alloy collector:
# - alloy: k8s-monitoring's `small` preset (clusters up to ~50 nodes).
# - configReloader: requests are the Alloy chart's default; limits are the
#   kube-prometheus-stack chart example for the same prometheus-config-reloader image.

alloy-logs:
  fullnameOverride: alloy-logs
  controller:
    type: daemonset
    # Also run on control-plane nodes, to read their pod and journal logs.
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    volumes:
      extra:
        # Created empty on nodes whose journal is only on disk.
        - name: run-journal
          hostPath:
            path: /run/log/journal
            type: DirectoryOrCreate
  alloy:
    configMap:
      create: false
      # Must match the ConfigMap name in templates/alloy-logs-config.yaml.
      name: alloy-logs-config
      key: config.alloy
    mounts:
      # Pod logs and the on-disk journal.
      varlog: true
      # Docker-runtime nodes link /var/log/pods files into here.
      dockercontainers: true
      # The in-memory journal.
      extra:
        - name: run-journal
          mountPath: /run/log/journal
          readOnly: true
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  configReloader:
    resources:
      requests:
        cpu: 10m
        memory: 50Mi
      limits:
        cpu: 200m
        memory: 50Mi
  serviceMonitor:
    enabled: false

alloy-receiver:
  fullnameOverride: alloy-receiver
  # One replica behind the alloy-receiver Service. Apps reach it from any node, so a
  # copy per node only adds compute. Rolling updates start the new pod first.
  controller:
    type: deployment
    replicas: 1
  alloy:
    configMap:
      create: false
      name: alloy-receiver-config
      key: config.alloy
    extraPorts:
      - name: otlp-grpc
        port: 4317
        targetPort: 4317
        protocol: TCP
      - name: otlp-http
        port: 4318
        targetPort: 4318
        protocol: TCP
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  configReloader:
    resources:
      requests:
        cpu: 10m
        memory: 50Mi
      limits:
        cpu: 200m
        memory: 50Mi
  serviceMonitor:
    enabled: false

alloy-events:
  fullnameOverride: alloy-events
  # One replica, so each event is sent once.
  controller:
    type: deployment
    replicas: 1
  alloy:
    configMap:
      create: false
      name: alloy-events-config
      key: config.alloy
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  configReloader:
    resources:
      requests:
        cpu: 10m
        memory: 50Mi
      limits:
        cpu: 200m
        memory: 50Mi
  serviceMonitor:
    enabled: false

alloy-metrics:
  fullnameOverride: alloy-metrics
  # Clustered: replicas share the scrape targets between them.
  controller:
    type: statefulset
    replicas: 1
  alloy:
    configMap:
      create: false
      name: alloy-metrics-config
      key: config.alloy
    clustering:
      enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  configReloader:
    resources:
      requests:
        cpu: 10m
        memory: 50Mi
      limits:
        cpu: 200m
        memory: 50Mi
  serviceMonitor:
    enabled: false

prometheus-node-exporter:
  fullnameOverride: node-exporter
  # Chart's example.
  resources:
    requests:
      cpu: 100m
      memory: 30Mi
    limits:
      cpu: 200m
      memory: 50Mi

kube-state-metrics:
  fullnameOverride: kube-state-metrics
  # Requests from the kube-state-metrics README; limits are our own (2x).
  resources:
    requests:
      cpu: 100m
      memory: 250Mi
    limits:
      cpu: 200m
      memory: 500Mi
