# k3s overrides. Argo Application (destination: the k3s cluster):
#   valueFiles: [values.yaml, values-k3s.yaml]
# Sends to observability-core on minikube through its ingress. Plain HTTP until TLS is
# set up.

cluster: k3s

endpoints:
  loki: http://loki.internal.deadrobot.co.uk
  prometheus: http://prometheus.internal.deadrobot.co.uk
  tempoOtlpHttp: http://tempo.internal.deadrobot.co.uk

# ServiceMonitor/PodMonitor scraping stays on (the default). It needs the Prometheus
# Operator CRDs, installed on k3s by the prometheus-operator-crds chart. The Alloy
# collectors get ServiceMonitors too, so alloy-metrics scrapes the agent itself.
alloy-logs:
  serviceMonitor:
    enabled: true
alloy-receiver:
  serviceMonitor:
    enabled: true
alloy-events:
  serviceMonitor:
    enabled: true
alloy-metrics:
  serviceMonitor:
    enabled: true
